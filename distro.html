<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Vinyl Records Distribution Portal</title>
    <!-- Links directly to your existing stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="pv-portal-wrapper">
    <div class="portal-container">
        <h2>PV Distro Engine</h2>
        <!-- Uses Web3Forms (100% Free Backend API) -->
        <form action="https://web3forms.com" method="POST" enctype="multipart/form-data">
            
            <!-- GO TO web3forms.com, put in your email to get a free key, and paste it below -->
            <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
            <input type="hidden" name="subject" value="New Release Ingestion - Paper Vinyl Records">
            
            <div class="form-group">
                <label for="artist">Primary Artist</label>
                <input type="text" id="artist" name="Artist_Name" placeholder="e.g., Artist Name" required>
            </div>

            <div class="form-group">
                <label for="title">Track Title</label>
                <input type="text" id="title" name="Track_Title" placeholder="e.g., Track Title" required>
            </div>

            <div class="form-group">
                <label for="label">Imprint Record Label</label>
                <!-- Hardcoded and locked to Paper Vinyl Records -->
                <input type="text" id="label" name="Record_Label" value="Paper Vinyl Records" readonly>
            </div>

            <div class="form-group">
                <label for="audio">Master Audio File (.WAV)</label>
                <input type="file" id="audio" name="Audio_File" accept=".wav" required>
            </div>

            <div class="form-group">
                <label for="artwork">Cover Art (.JPG)</label>
                <input type="file" id="artwork" name="Artwork_File" accept=".jpg,.jpeg" required>
            </div>

            <button type="submit" class="pv-distro-btn">Compile and Process Release</button>
        </form>
    </div>
</div>

</body>
</html>
