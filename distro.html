<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Vinyl Records - Distro Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="pv-portal-wrapper">
    <div class="portal-container">
        <h2>PV Distro Engine</h2>
        
        <form id="pvDistroForm">
            <div class="form-group">
                <label for="pvArtist">Primary Artist</label>
                <input type="text" id="pvArtist" placeholder="e.g., Mac Miller" required>
            </div>

            <div class="form-group">
                <label for="pvTitle">Track Title</label>
                <input type="text" id="pvTitle" placeholder="e.g., Swimming Upstream" required>
            </div>

            <div class="form-group">
                <label for="pvLabel">Imprint Record Label</label>
                <input type="text" id="pvLabel" value="Paper Vinyl Records" readonly>
            </div>

            <button type="submit" class="pv-distro-btn">Compile and Process Release</button>
        </form>
    </div>
</div>

<script>
document.getElementById('pvDistroForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const artistName = document.getElementById('pvArtist').value;
    const trackTitle = document.getElementById('pvTitle').value;

    const payload = {
        event_type: "submit_release",
        client_payload: {
            artist: artistName,
            title: trackTitle
        }
    };

    // CONFIGURATION CONFIG
    const GITHUB_USERNAME = "PaperVinylRecords"; 
    const REPO_NAME = "papervinylrecords.github.io"; 
    
    // PASTE YOUR GENERATED TOKEN HERE INSIDE THE QUOTES
    const PERSONAL_ACCESS_TOKEN = "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"; 

    const targetUrl = `https://github.com{GITHUB_USERNAME}/${REPO_NAME}/dispatches`;
    
    // Explicitly stripping spaces to ensure the bearer authorization token parses cleanly
    const cleanToken = PERSONAL_ACCESS_TOKEN.trim();

    try {
        const response = await fetch(targetUrl, {
            method: "POST",
            headers: {
                // FIXED: Explicitly added the required User-Agent string to satisfy GitHub API rules
                "User-Agent": "Paper-Vinyl-Distro-App",
                "Accept": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28", 
                "Authorization": `token ${cleanToken}`, 
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        if (response.status === 204 || response.ok) {
            alert("Success! Backend pipeline triggered. Check your Actions tab.");
            document.getElementById('pvDistroForm').reset();
        } else {
            const errorText = await response.text();
            alert(`API Response Code: ${response.status}\nDetails: ${errorText}`);
        }
    } catch (error) {
        console.error("Fetch Interrupted Details:", error);
        alert(`Transmission Blocked!\n\nReason: Your browser dropped the connection to GitHub.\n\nFix This:\n1. Go to your GitHub organization token policy settings and authorize this token.\n2. Ensure your token string starts with "ghp_".`);
    }
});
</script>

</body>
</html>
