<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Vinyl Records - Distro Portal</title>
    <!-- Automatically hooks into your existing stylesheet styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="pv-portal-wrapper">
    <div class="portal-container">
        <h2>PV Distro Engine</h2>
        
        <form id="pvDistroForm">
            <div class="form-group">
                <label for="pvArtist">Primary Artist</label>
                <input type="text" id="pvArtist" placeholder="e.g., Mac Miller" required>
            </div>

            <div class="form-group">
                <label for="pvTitle">Track Title</label>
                <input type="text" id="pvTitle" placeholder="e.g., Swimming Upstream" required>
            </div>

            <div class="form-group">
                <label for="pvLabel">Imprint Record Label</label>
                <!-- Hardcoded and locked so metadata stays consistent across API requests -->
                <input type="text" id="pvLabel" value="Paper Vinyl Records" readonly>
            </div>

            <button type="submit" class="pv-distro-btn">Compile and Process Release</button>
        </form>
    </div>
</div>

<script>
document.getElementById('pvDistroForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    // 1. Grab fresh values directly from the input fields above
    const artistName = document.getElementById('pvArtist').value;
    const trackTitle = document.getElementById('pvTitle').value;

    // 2. Build the secure data payload structure that our Python workflow expects
    const payload = {
        event_type: "submit_release",
        client_payload: {
            artist: artistName,
            title: trackTitle
        }
    };

    // CONFIGURATION CONFIG: Double check your token is inside the quotes below
    const GITHUB_USERNAME = "PaperVinylRecords"; 
    const REPO_NAME = "papervinylrecords.github.io"; 
    const PERSONAL_ACCESS_TOKEN = "YOUR_GITHUB_PERSONAL_ACCESS_TOKEN"; 

    const targetUrl = `https://github.com{GITHUB_USERNAME}/${REPO_NAME}/dispatches`;
    
    try {
        // 3. Fire the secure POST call using explicit CORS and structural headers
        const response = await fetch(targetUrl, {
            method: "POST",
            mode: "cors", // Forces the web browser to allow the cross-domain transmission
            headers: {
                "Accept": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28", // Explicit API version required by modern GitHub engines
                "Authorization": `Bearer ${PERSONAL_ACCESS_TOKEN.trim()}`, 
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        // GitHub returns a 204 No Content status when a repository dispatch is successfully triggered
        if (response.status === 204) {
            alert("Success! Backend pipeline triggered. Your metadata.json and CSV will update in a few seconds.");
            document.getElementById('pvDistroForm').reset();
        } else {
            const errorText = await response.text();
            console.error("API Error Status:", response.status, errorText);
            alert(`API rejected request. Status: ${response.status}. Reason: ${errorText || 'Check token permissions.'}`);
        }
    } catch (error) {
        // If the browser blocks the connection locally, print the exact system error details
        console.error("Transmission Error:", error);
        alert(`Network transmission error: ${error.message}\n\nIf this persists, make sure your token is pasted correctly and your organization allows classic token access.`);
    }
});
</script>

</body>
</html>
