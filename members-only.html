<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* OVERRIDE CONTENT WRAPPER FOR PERFECT CENTERING */
        .content-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 100px 20px 40px; /* Accounts for 70px header */
            box-sizing: border-box;
        }

        /* LOGIN CONTAINER */
        .login-container {
            width: 100%;
            max-width: 450px; /* Slightly narrower than the submission form for a tighter look */
            background: rgba(18, 18, 18, 0.8);
            padding: 50px 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
            text-align: center;
        }

        .login-title {
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            font-size: 1.5rem;
            color: white;
        }

        .login-subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.8);
        }

        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* Focus states for inputs */
        .form-group input:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.2);
        }

        /* Submit Button */
        .login-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: white;
            border: 1px solid white;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #00ff00;
            color: #121212;
            border-color: #00ff00;
            transform: translateY(-2px);
        }

        /* Footer Links */
        .login-links {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-links a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: 0.3s;
        }

        .login-links a:hover {
            color: #00ff00;
        }
    </style>
</head>
<body>

    <!-- PERSISTENT BLUR MENU -->
    <header id="top-menu">
        <img src="logo.png" alt="Logo" class="nav-logo">
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="#">About</a>
            <div class="dropdown">
                <a href="#">Submit ▼</a>
                <div class="dropdown-content">
                    <a href="submit.html">Music</a>
                    <a href="#">Art</a>
                </div>
            </div>
            <!-- Added the Member Login link to the navbar to tie it together -->
            <a href="members-only.html" style="color: #00ff00 !important;">Portal</a>
        </nav>
    </header>

    <!-- CONTENT LAYOUT -->
    <div class="content-wrapper">
        <div class="login-container">
            <!-- Optional: You can put a lock icon or small logo here -->
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00ff00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 15px;">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            
            <h1 class="login-title">Artist Login</h1>
            <p class="login-subtitle">Label Roster Portal Access</p>
            
            <!-- Standard form pointing to a backend endpoint. Modify 'action' as needed when you build out the backend -->
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="email">Artist Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="login-btn">Access Portal</button>
            </form>

            <div class="login-links">
                <a href="#">Forgot Password?</a>
                <a href="submit.html">Apply for Roster</a>
            </div>
        </div>
    </div>

</body>
</html>
