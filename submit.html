<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Submission</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* OVERRIDE CONTENT WRAPPER FOR PERFECT CENTERING */
        .content-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 100px 20px 40px; /* Accounts for 70px header */
            box-sizing: border-box;
        }

        .page-title {
            margin-bottom: 30px;
        }

        /* FORM STYLES */
        .form-container {
            width: 100%;
            max-width: 650px;
            background: rgba(18, 18, 18, 0.8);
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 25px;
            width: 100%;
        }

        /* Side-by-side fields */
        .form-row {
            display: flex;
            gap: 20px;
            width: 100%;
        }
        .form-row .form-group {
            flex: 1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.8);
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="date"],
        .form-group select,
        .form-group textarea,
        .form-group input[type="file"] {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* Dropdown specific styles */
        .form-group select {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
        }
        .form-group select option {
            background: #121212;
            color: white;
            padding: 10px;
        }

        /* Checkbox specific styles */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
        }
        
        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #00ff00;
            cursor: pointer;
        }

        .helper-text {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
            margin-bottom: 0;
            font-style: italic;
        }

        /* File input specific styling */
        .form-group input[type="file"]::file-selector-button {
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 8px 15px;
            margin-right: 15px;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .form-group input[type="file"]::file-selector-button:hover {
            background: #00ff00;
            color: #121212;
            border-color: #00ff00;
        }

        /* Focus states for inputs */
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.2);
        }

        /* Add Contributor Button */
        .add-contributor-btn {
            background: transparent;
            color: #00ff00;
            border: 1px dashed #00ff00;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-bottom: 25px;
        }
        
        .add-contributor-btn:hover {
            background: rgba(0, 255, 0, 0.1);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: white;
            border: 1px solid white;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #00ff00;
            color: #121212;
            border-color: #00ff00;
            transform: translateY(-2px);
        }

        /* Mobile responsiveness for side-by-side */
        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .checkbox-group {
                margin-top: -10px;
                margin-bottom: 25px;
            }
        }
    </style>
</head>
<body>

    <!-- PERSISTENT BLUR MENU -->
    <header id="top-menu">
        <img src="logo.png" alt="Logo" class="nav-logo">
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <div class="dropdown">
                <a href="#">Submit ▼</a>
                <div class="dropdown-content">
                    <a href="#">Music</a>
                    <a href="#">Art</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- CONTENT LAYOUT -->
    <div class="content-wrapper">
        <h1 class="page-title">Music Submission</h1>
        
        <div class="form-container">
            <form action="https://formsubmit.co/your@email.com" method="POST" enctype="multipart/form-data">
                
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="https://yourwebsite.com/music-submit-success.html">

                <!-- EMAIL CAPTURE -->
                <div class="form-group">
                    <label for="submitter_email">Your Email Address</label>
                    <input type="email" id="submitter_email" name="submitter_email" placeholder="In case we need to contact you" required>
                </div>
                
                <!-- RELEASE TYPE -->
                <div class="form-group">
                    <label for="release_type">Release Type</label>
                    <select id="release_type" name="release_type" required>
                        <option value="" disabled selected>Select Type...</option>
                        <option value="Single (1-3 tracks)">Single (1-3 tracks)</option>
                        <option value="Album/EP (4-50 tracks)">Album/EP (4-50 tracks)</option>
                    </select>
                </div>

                <!-- ARTIST DETAILS -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="song_name">Song/Project Name</label>
                        <input type="text" id="song_name" name="song_name" required>
                    </div>
                    <div class="form-group">
                        <label for="artist_name">Artist Name</label>
                        <input type="text" id="artist_name" name="artist_name" required>
                    </div>
                </div>

                <!-- NUMBER OF ARTISTS & VARIOUS ARTISTS CHECKBOX -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="artist_count">Number of Artists</label>
                        <select id="artist_count" name="artist_count" required>
                            <option value="" disabled selected>Select Count...</option>
                            <option value="1 Artist">1 Artist</option>
                            <option value="2 Artists">2 Artists</option>
                            <option value="3 Artists">3 Artists</option>
                        </select>
                    </div>
                    
                    <div class="form-group checkbox-group" style="padding-top: 15px;">
                        <label class="checkbox-label">
                            <input type="checkbox" id="various_artists" name="various_artists" value="Yes">
                            <span>Various Artists</span>
                        </label>
                        <p class="helper-text">Check this if you have over 3 artists on the main release.</p>
                    </div>
                </div>

                <div class="form-group">
                    <label for="release_date">Release Date</label>
                    <input type="date" id="release_date" name="release_date" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="audio_file">Audio File (MP3, WAV)</label>
                        <input type="file" id="audio_file" name="audio_file" accept="audio/*" required>
                    </div>
                    <div class="form-group">
                        <label for="cover_art">Cover Art</label>
                        <input type="file" id="cover_art" name="cover_art" accept="image/*" required>
                    </div>
                </div>

                <!-- SPLIT SONGWRITER CREDITS -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="songwriter_first_name">Songwriter First Name</label>
                        <input type="text" id="songwriter_first_name" name="songwriter_first_name" required>
                    </div>
                    <div class="form-group">
                        <label for="songwriter_last_name">Songwriter Last Name</label>
                        <input type="text" id="songwriter_last_name" name="songwriter_last_name" required>
                    </div>
                </div>

                <!-- DYNAMIC PRODUCTION CREDITS CONTAINER -->
                <div id="contributors_container">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="production_role_1">Production Role 1</label>
                            <select id="production_role_1" name="production_role_1" required>
                                <option value="" disabled selected>Select Role...</option>
                                <option value="Producer">Producer</option>
                                <option value="Co-Producer">Co-Producer</option>
                                <option value="Vocal Producer">Vocal Producer</option>
                                <option value="Vocals">Vocals</option>
                                <option value="Background Vocals">Background Vocals</option>
                                <option value="Guitar">Guitar</option>
                                <option value="Bass">Bass</option>
                                <option value="Piano">Piano</option>
                                <option value="Keyboards">Keyboards</option>
                                <option value="Synthesizer">Synthesizer</option>
                                <option value="Drums">Drums</option>
                                <option value="Percussion">Percussion</option>
                                <option value="Strings">Strings</option>
                                <option value="All Instruments">All Instruments</option>
                                <option value="Programming">Programming</option>
                                <option value="Mixing Engineer">Mixing Engineer</option>
                                <option value="Mastering Engineer">Mastering Engineer</option>
                                <option value="Recording Engineer">Recording Engineer</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="production_name_1">Contributor Name 1</label>
                            <input type="text" id="production_name_1" name="production_name_1" placeholder="Name of person" required>
                        </div>
                    </div>
                </div>

                <!-- ADD CONTRIBUTOR BUTTON -->
                <button type="button" id="add_contributor_btn" class="add-contributor-btn">+ Add Another Contributor</button>

                <button type="submit" class="submit-btn">Submit Track</button>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT FOR DYNAMIC FIELDS -->
    <script>
        let contributorCount = 1;
        
        const roleOptions = `
            <option value="" disabled selected>Select Role...</option>
            <option value="Producer">Producer</option>
            <option value="Co-Producer">Co-Producer</option>
            <option value="Vocal Producer">Vocal Producer</option>
            <option value="Vocals">Vocals</option>
            <option value="Background Vocals">Background Vocals</option>
            <option value="Guitar">Guitar</option>
            <option value="Bass">Bass</option>
            <option value="Piano">Piano</option>
            <option value="Keyboards">Keyboards</option>
            <option value="Synthesizer">Synthesizer</option>
            <option value="Drums">Drums</option>
            <option value="Percussion">Percussion</option>
            <option value="Strings">Strings</option>
            <option value="All Instruments">All Instruments</option>
            <option value="Programming">Programming</option>
            <option value="Mixing Engineer">Mixing Engineer</option>
            <option value="Mastering Engineer">Mastering Engineer</option>
            <option value="Recording Engineer">Recording Engineer</option>
        `;

        document.getElementById('add_contributor_btn').addEventListener('click', function() {
            contributorCount++;
            const container = document.getElementById('contributors_container');
            const newRow = document.createElement('div');
            newRow.className = 'form-row';
            
            newRow.innerHTML = `
                <div class="form-group">
                    <label for="production_role_${contributorCount}">Production Role ${contributorCount}</label>
                    <select id="production_role_${contributorCount}" name="production_role_${contributorCount}" required>
                        ${roleOptions}
                    </select>
                </div>
                <div class="form-group">
                    <label for="production_name_${contributorCount}">Contributor Name ${contributorCount}</label>
                    <input type="text" id="production_name_${contributorCount}" name="production_name_${contributorCount}" placeholder="Name of person" required>
                </div>
            `;
            
            container.appendChild(newRow);
        });
    </script>
</body>
</html>
