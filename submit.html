<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Submission</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* OVERRIDE CONTENT WRAPPER FOR PERFECT CENTERING */
        .content-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 100px 20px 40px; /* Accounts for 70px header */
            box-sizing: border-box;
        }

        .page-title {
            margin-bottom: 30px;
        }

        /* FORM STYLES */
        .form-container {
            width: 100%;
            max-width: 650px;
            background: rgba(18, 18, 18, 0.8);
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 25px;
            width: 100%;
        }

        /* Side-by-side fields */
        .form-row {
            display: flex;
            gap: 20px;
            width: 100%;
        }
        .form-row .form-group {
            flex: 1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.8);
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="date"],
        .form-group select,
        .form-group textarea,
        .form-group input[type="file"] {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* Dropdown specific styles */
        .form-group select {
            cursor: pointer;
        }
        .form-group select option {
            background: #121212;
            color: white;
            padding: 10px;
        }

        /* File input specific styling */
        .form-group input[type="file"]::file-selector-button {
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 8px 15px;
            margin-right: 15px;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .form-group input[type="file"]::file-selector-button:hover {
            background: #00ff00;
            color: #121212;
            border-color: #00ff00;
        }

        /* Focus states for inputs */
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.2);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: white;
            border: 1px solid white;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #00ff00;
            color: #121212;
            border-color: #00ff00;
            transform: translateY(-2px);
        }

        /* Mobile responsiveness for side-by-side */
        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <!-- PERSISTENT BLUR MENU -->
    <header id="top-menu">
        <img src="logo.png" alt="Logo" class="nav-logo">
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <div class="dropdown">
                <a href="#">Submit ▼</a>
                <div class="dropdown-content">
                    <a href="#">Music</a>
                    <a href="#">Art</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- CONTENT LAYOUT -->
    <div class="content-wrapper">
        <h1 class="page-title">Music Submission</h1>
        
        <div class="form-container">
            <form action="https://formsubmit.co/your@email.com" method="POST" enctype="multipart/form-data">
                
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="https://yourwebsite.com/music-submit-success.html">

                <!-- EMAIL CAPTURE -->
                <div class="form-group">
                    <label for="submitter_email">Your Email Address</label>
                    <input type="email" id="submitter_email" name="submitter_email" placeholder="In case we need to contact you" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="song_name">Song Name</label>
                        <input type="text" id="song_name" name="song_name" required>
                    </div>
                    <div class="form-group">
                        <label for="artist_name">Artist Name</label>
                        <input type="text" id="artist_name" name="artist_name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="release_date">Release Date</label>
                    <input type="date" id="release_date" name="release_date" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="audio_file">Audio File (MP3, WAV)</label>
                        <input type="file" id="audio_file" name="audio_file" accept="audio/*" required>
                    </div>
                    <div class="form-group">
                        <label for="cover_art">Cover Art</label>
                        <input type="file" id="cover_art" name="cover_art" accept="image/*" required>
                    </div>
                </div>

                <!-- SPLIT SONGWRITER CREDITS -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="songwriter_first_name">Songwriter First Name</label>
                        <input type="text" id="songwriter_first_name" name="songwriter_first_name" required>
                    </div>
                    <div class="form-group">
                        <label for="songwriter_last_name">Songwriter Last Name</label>
                        <input type="text" id="songwriter_last_name" name="songwriter_last_name" required>
                    </div>
                </div>

                <!-- DROPDOWN PRODUCTION CREDITS -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="production_role">Production Role</label>
                        <select id="production_role" name="production_role" required>
                            <option value="" disabled selected>Select Role...</option>
                            <option value="Producer">Producer</option>
                            <option value="Co-Producer">Co-Producer</option>
                            <option value="Vocal Producer">Vocal Producer</option>
                            <option value="Vocals">Vocals</option>
                            <option value="Background Vocals">Background Vocals</option>
                            <option value="Guitar">Guitar</option>
                            <option value="Bass">Bass</option>
                            <option value="Piano">Piano</option>
                            <option value="Keyboards">Keyboards</option>
                            <option value="Synthesizer">Synthesizer</option>
                            <option value="Drums">Drums</option>
                            <option value="Percussion">Percussion</option>
                            <option value="Strings">Strings</option>
                            <option value="All Instruments">All Instruments</option>
                            <option value="Programming">Programming</option>
                            <option value="Mixing Engineer">Mixing Engineer</option>
                            <option value="Mastering Engineer">Mastering Engineer</option>
                            <option value="Recording Engineer">Recording Engineer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="production_name">Contributor Name</label>
                        <input type="text" id="production_name" name="production_name" placeholder="Name of person" required>
                    </div>
                </div>
                
                <!-- Additional Notes / Extra Credits (Optional) -->
                <div class="form-group">
                    <label for="extra_credits">Additional Credits (Optional)</label>
                    <textarea id="extra_credits" name="extra_credits" rows="2" placeholder="List any other contributors here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit Track</button>
            </form>
        </div>
    </div>

</body>
</html>
